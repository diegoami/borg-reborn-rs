[package]
name = "borg-reborn-rs"
version = "0.0.0"
edition = "2021"
license = "GPL-2.0-only"
description = "The Angband Borg reborn: an automatic player for Angband, redesigned in Rust"
publish = false

[lib]
name = "borg_reborn_rs"
path = "src/lib.rs"
# rlib for tests and tools; staticlib for the engine build (engine/CMakeLists.txt).
crate-type = ["rlib", "staticlib"]

[features]
test-r4-power = ["borg-next/test-r4-power"]
test-r4-item-use = ["borg-next/test-r4-item-use"]
test-r3-defence = ["borg-next/test-r3-defence"]
# Declared synthetic M13 branch fixture; never a measured arm.
test-m13-danger = ["borg-next/test-m13-danger"]
recording = ["dep:angband-recorder"]
# Harness builds only (harness/build.sh): report decisions to the borgh frontend.
borgh = []
# Test builds only (CI): perception runs while the player hallucinates, and
# each think asserts the game's RNG is unchanged (RULES 10 regression).
test-hallucinate = []
# Test builds only (CI, T2.5): each think's observation and world are checked
# against the engine through other routes (engine.rs, ENGINE TRUTH), and the
# report goes to BORG_RUN_DIR/truth.jsonl.
test-perception = []

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
borg-core = { path = "../borg-core" }
borg-next = { path = "../borg-next" }

angband-recorder = { path = "../vendor/angband-recorder", optional = true, features = ["ffi"] }
