[package]
name = "borg-next"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
publish = false
description = "Track R decision code over borg-rs memory"

[features]
test-r4-store = ["test-r4-equipment", "borg-core/test-r4-store"]
test-r4-equipment = ["test-r4-power", "borg-core/test-r4-equipment"]
test-r4-power = ["test-r4-item-use"]
test-r4-item-use = ["borg-core/test-r4-item-use"]
test-r3-defence = ["borg-core/test-r3-defence"]
test-m13-danger = ["borg-core/test-m13-danger"]

[dependencies]
borg-core = { path = "../borg-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
