name: pr-base

# #1382: a P or R task PR into main (#1370) is flagged. No branch filter:
# a PR retargeted to its track branch runs this again and clears the flag.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-pr-base.py ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
