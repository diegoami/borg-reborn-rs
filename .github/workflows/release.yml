name: release

# #819 (owner, 2026-11-21): bundle Angband with the Borg and make a draft
# GitHub release, adapted from upstream's release.yaml
# (engine/angband/.github/workflows/release.yaml). Unlike upstream it never
# runs on an ordinary push or pull request: only on demand, when a milestone
# is reached (the runner slots are shared with borg-zoo's experiments).
#   - Actions > release > Run workflow: a version (v...), a ref, optionally
#     the milestone (its PLAN.md row goes into the notes) and the zoo's
#     measurement of the commit;
#   - or push a tag v...: the release of that tag's commit.
# The release is always a draft; the owner reviews and publishes it.
# Packages: Linux x86_64, macOS arm64 (#824) and Windows x86_64 (#823); each
# is played from its own unpacked package against the smoke reference.
# docs/RELEASING.md says how to cut one and how to make a dry run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version and tag, v... (e.g. v0.1.0 or v0.0.0-dryrun.1)"
        required: true
      ref:
        description: "Branch, tag or commit to release"
        required: true
        default: main
      milestone:
        description: "Milestone label whose PLAN.md row goes into the notes (e.g. P7); optional"
        required: false
        default: ""
      zoo:
        description: "URL of borg-zoo's measurement of this exact commit; optional (the notes then say it is missing)"
        required: false
        default: ""
      since:
        description: "List the handover notes added or changed since this tag or commit; optional (default: the previous v* tag, or all)"
        required: false
        default: ""
      release:
        description: "Make the draft release (off: build and check the packages only, keep them as run artifacts)"
        type: boolean
        required: false
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      milestone: ${{ steps.v.outputs.milestone }}
      zoo: ${{ steps.v.outputs.zoo }}
      since: ${{ steps.v.outputs.since }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.inputs.ref }}
          fetch-depth: 0
      - id: v
        env:
          IN_VERSION: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          IN_MILESTONE: ${{ github.event.inputs.milestone }}
          IN_ZOO: ${{ github.event.inputs.zoo }}
          IN_SINCE: ${{ github.event.inputs.since }}
          # A tag push has no inputs: it always makes the draft.
          IN_RELEASE: ${{ github.event_name == 'push' || github.event.inputs.release != 'false' }}
        run: |
          [[ "$IN_VERSION" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo "version '$IN_VERSION' is not v<digit>..."; exit 1; }
          [[ -z "$IN_MILESTONE" || "$IN_MILESTONE" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "milestone '$IN_MILESTONE': a label is expected"; exit 1; }
          [[ -z "$IN_ZOO" || "$IN_ZOO" =~ ^https://[A-Za-z0-9./_#?=%:-]+$ ]] || { echo "zoo: an https URL is expected"; exit 1; }
          if [ -n "$IN_SINCE" ]; then
            [[ "$IN_SINCE" =~ ^[A-Za-z0-9._/-]+$ ]] && git rev-parse -q --verify "$IN_SINCE^{commit}" >/dev/null \
              || { echo "since '$IN_SINCE': not a tag or commit of this repository"; exit 1; }
          fi
          # A dispatched version that is already a tag must name the commit released.
          sha=$(git rev-parse HEAD)
          if git rev-parse -q --verify "refs/tags/$IN_VERSION" >/dev/null; then
            tagged=$(git rev-parse "refs/tags/$IN_VERSION^{commit}")
            [ "$tagged" = "$sha" ] || { echo "tag $IN_VERSION is $tagged, not the ref's $sha"; exit 1; }
          fi
          {
            echo "version=$IN_VERSION"
            echo "sha=$sha"
            echo "milestone=$IN_MILESTONE"
            echo "zoo=$IN_ZOO"
            echo "since=$IN_SINCE"
            echo "release=$IN_RELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "release $IN_VERSION of $sha (draft release: $IN_RELEASE)"

  docs:
    # Upstream's docconvert: the Angband manual to HTML with Sphinx.
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - run: |
          python3 -m venv "$RUNNER_TEMP/sphinx"
          "$RUNNER_TEMP/sphinx/bin/pip" install -q sphinx sphinx-better-theme
      # conf.py takes its version from upstream's scripts/version.sh, which
      # here would describe our repository: name the upstream commit instead.
      - run: |
          upstream=$(sed -n 's/^commit=//p' engine/UPSTREAM)
          "$RUNNER_TEMP/sphinx/bin/sphinx-build" -q -b html -D version="${upstream:0:8}" -D release="upstream ${upstream:0:8}" \
            engine/angband/docs "$RUNNER_TEMP/docs/html"
          test -s "$RUNNER_TEMP/docs/html/index.html"
          git diff --exit-code -- engine/angband
      - uses: actions/upload-artifact@v4
        with:
          name: release-docs
          path: ${{ runner.temp }}/docs
          retention-days: 3

  source:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/release/source-archive.sh "${{ needs.setup.outputs.version }}" "$RUNNER_TEMP/source"
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/source/*.tar.gz
          retention-days: 3

  linux:
    needs: [setup, docs]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/deaths" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
      # harness/run.sh refuses to play without the death tools (it exports a
      # natural death to the registry above, RULES 12). Smoke has no death
      # today, but a suite or play change that dies is then still recorded.
      - uses: ./.github/actions/cemetery-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/apt-install
        with:
          packages: cmake libx11-dev libssl-dev libncurses-dev
      # The headless build, checked as CI checks it: the default core plays
      # the smoke suite with the same keys, messages and states as
      # harness/reference/smoke-borg-rs.
      - run: BORG_IMPL=rust harness/build.sh
      - run: BORG_IMPL=rust harness/suite.sh smoke harness/out/release-smoke-headless
      - run: harness/diff --suite smoke --expect-impl rust harness/out/release-smoke-headless harness/reference/smoke-borg-rs
      - run: cp -a build/rust build/release-headless
      # The window build (X11, curses and borgh frontends in one binary): the
      # same check.
      - run: BORG_IMPL=rust BORG_X11=ON BORG_GCU=ON harness/build.sh
      - run: BORG_IMPL=rust harness/suite.sh smoke harness/out/release-smoke-x11
      - run: harness/diff --suite smoke --expect-impl rust harness/out/release-smoke-x11 harness/reference/smoke-borg-rs
      - uses: actions/download-artifact@v4
        with:
          name: release-docs
          path: ${{ runner.temp }}/docs
      - run: scripts/release/package.sh linux "${{ needs.setup.outputs.version }}" "$RUNNER_TEMP/package" "$RUNNER_TEMP/docs" angband=build/rust angband-headless=build/release-headless
      - run: |
          mkdir -p "$RUNNER_TEMP/identity"
          cp build/release-headless/BUILD_ID "$RUNNER_TEMP/identity/BUILD_ID.linux-angband-headless"
          cp build/rust/BUILD_ID "$RUNNER_TEMP/identity/BUILD_ID.linux-angband"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ${{ runner.temp }}/package/*.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: release-identity-linux
          path: ${{ runner.temp }}/identity
          retention-days: 3

  linux-clean:
    # The package on a clean machine: a bare Ubuntu 24.04 with only the
    # runtime libraries PLAYING.txt names. The headless game plays the
    # reference's keys, and the window opens (under Xvfb).
    needs: [setup, linux]
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    # In a job container run steps default to sh (dash): use bash, as the
    # scripts and local checks do (review of #827). bash is an Essential
    # package of ubuntu:24.04, so the image has it.
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libssl3t64 libx11-6 libncursesw6 xfonts-base xvfb xauth xz-utils ca-certificates git >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: /tmp/release
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
          path: src
          sparse-checkout: harness/reference/smoke-borg-rs
      - run: |
          mkdir /tmp/clean && cd /tmp/clean
          tar -xzf /tmp/release/*.tar.gz
          cd borg-reborn-rs-*
          sha256sum -c --quiet SHA256SUMS
          ls LICENSES/angband-copying.rst LICENSES/borg-reborn-rs-GPL-2.0.txt LICENSES/rust-crates.txt PLAYING.txt
          ./play-headless.sh /tmp/game 101 0 0 20000
          ref="$GITHUB_WORKSPACE/src/harness/reference/smoke-borg-rs/smoke-warrior-1"
          for f in keys messages state; do xz -dc "$ref/$f.log.xz" | cmp - "/tmp/game/$f.log"; done
          echo "the package plays smoke-warrior-1's keys, messages and states"
      - run: |
          cd /tmp/clean/borg-reborn-rs-*
          set +e
          timeout 15 xvfb-run -a ./watch-borg.sh ReleaseCheck
          rc=$?
          set -e
          # 124: still running when the timeout stopped it, i.e. the window opened.
          [ "$rc" = 124 ] || { echo "watch-borg.sh exited with $rc before the timeout"; exit 1; }

  macos:
    # #824: Apple silicon. The curses and headless frontends in one binary,
    # OpenSSL linked in statically (Homebrew's), the system's curses. The
    # harness needs GNU tools and a modern bash: Homebrew's, first on PATH.
    # Then the unpacked package plays the smoke games with macOS's own
    # tools only (bash 3.2, BSD sed), as a player's machine would.
    needs: [setup, docs]
    runs-on: macos-latest
    # The oldest macOS the package runs on (PLAYING.txt): the C compiler and
    # rustc both read it.
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - run: echo "BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/deaths" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: ./.github/actions/cemetery-tools
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          brew install bash coreutils gnu-sed findutils openssl@3 xz
          b=$(brew --prefix)
          for p in "$b/opt/findutils/libexec/gnubin" "$b/opt/gnu-sed/libexec/gnubin" "$b/opt/coreutils/libexec/gnubin" "$b/bin"; do
            echo "$p" >> "$GITHUB_PATH"
          done
          echo "OPENSSL_ROOT_DIR=$b/opt/openssl@3" >> "$GITHUB_ENV"
      - run: BORG_IMPL=rust BORG_GCU=ON harness/build.sh
      - run: harness/identity.sh binary-impl build/rust/game/angband | grep -qx rust
      - run: BORG_IMPL=rust harness/suite.sh smoke harness/out/release-smoke-macos
      - run: harness/diff --suite smoke --expect-impl rust harness/out/release-smoke-macos harness/reference/smoke-borg-rs
      # A platform that plays differently: where the messages first part, and
      # every run's logs as an artifact.
      - if: failure()
        run: |
          for r in smoke-warrior-1 smoke-mage-2 smoke-priest-3; do
            echo "== $r"; xz -dc "harness/reference/smoke-borg-rs/$r/messages.log.xz" | diff - "harness/out/release-smoke-macos/$r/messages.log" | head -30 || true
            tail -20 "harness/out/release-smoke-macos/$r/stderr.log" || true
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-failure
          path: harness/out/release-smoke-macos
          retention-days: 7
      # Nothing outside the system: no Homebrew library is linked.
      - run: |
          otool -L build/rust/game/angband
          ! otool -L build/rust/game/angband | grep -E '/(opt|usr/local)/'
      - uses: actions/download-artifact@v4
        with:
          name: release-docs
          path: ${{ runner.temp }}/docs
      - run: scripts/release/package.sh macos "${{ needs.setup.outputs.version }}" "$RUNNER_TEMP/package" "$RUNNER_TEMP/docs" angband=build/rust
      - name: The package with macOS's own tools
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: |
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          tar -xzf "$RUNNER_TEMP"/package/*.tar.gz
          cd borg-reborn-rs-*
          shasum -a 256 -c --quiet SHA256SUMS
          ls LICENSES/angband-copying.rst LICENSES/openssl.txt PLAYING.txt
          /bin/bash ./play-headless.sh "$RUNNER_TEMP/g1" 101 0 0 20000 >/dev/null
          /bin/bash ./play-headless.sh "$RUNNER_TEMP/g2" 102 2 1 20000 >/dev/null
          /bin/bash ./play-headless.sh "$RUNNER_TEMP/g3" 103 5 3 20000 >/dev/null
          python3 "$GITHUB_WORKSPACE/scripts/release/compare-games.py" "$GITHUB_WORKSPACE/harness/reference/smoke-borg-rs" \
            smoke-warrior-1="$RUNNER_TEMP/g1" smoke-mage-2="$RUNNER_TEMP/g2" smoke-priest-3="$RUNNER_TEMP/g3"
      # The terminal window: the curses frontend starts and keeps running
      # (stopped by the alarm) in a pseudo-terminal. Informative only: a
      # runner's terminal is not a player's.
      - name: watch-borg.sh in a pseudo-terminal
        continue-on-error: true
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
          TERM: xterm-256color
        run: |
          cd "$RUNNER_TEMP"/clean/borg-reborn-rs-*
          set +e
          perl -e 'alarm 15; exec @ARGV' script -q /dev/null /bin/bash -c 'stty cols 100 rows 30; ./watch-borg.sh MacCheck' </dev/null >/dev/null
          rc=$?
          set -e
          [ "$rc" = 142 ] || { echo "watch-borg.sh ended with $rc before the alarm"; exit 1; }
      - run: |
          mkdir -p "$RUNNER_TEMP/identity"
          cp build/rust/BUILD_ID "$RUNNER_TEMP/identity/BUILD_ID.macos-angband"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ runner.temp }}/package/*.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: release-identity-macos
          path: ${{ runner.temp }}/identity
          retention-days: 3

  windows:
    # #823: 64-bit Windows, built with MSYS2's UCRT64 toolchain (GCC, Rust,
    # OpenSSL, ncurses) as upstream builds its Windows release. Upstream's
    # main.c in console mode with the curses and headless frontends; one
    # static angband.exe. The unpacked package then plays the smoke games
    # through its PowerShell runner, as a player would.
    needs: [setup, docs]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The game data and patches are compared byte for byte: no CRLF.
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git patch diffutils xz
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-ncurses
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-python
      - run: |
          git config --global --add safe.directory "$(pwd)"
          rustc -vV
          CMAKE_GENERATOR=Ninja BORG_IMPL=rust BORG_GCU=ON harness/build.sh
      - run: harness/identity.sh binary-impl build/rust/game/angband.exe | grep -qx rust
      # One static executable: no MSYS2 DLL next to it.
      - run: |
          ldd build/rust/game/angband.exe
          ! ldd build/rust/game/angband.exe | grep -i '/ucrt64/'
      - uses: actions/download-artifact@v4
        with:
          name: release-docs
          path: ${{ runner.temp }}/docs
      - run: |
          t=$(cygpath -u '${{ runner.temp }}')
          scripts/release/package.sh windows "${{ needs.setup.outputs.version }}" "$t/package" "$t/docs" angband=build/rust
      - name: The package with Windows' own tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem "$env:RUNNER_TEMP\package\*.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\clean"
          $pkg = Get-ChildItem "$env:RUNNER_TEMP\clean" -Directory | Select-Object -First 1
          Set-Location $pkg.FullName
          foreach ($line in Get-Content SHA256SUMS) {
            $hash, $file = $line -split '  ', 2
            if ((Get-FileHash -Algorithm SHA256 $file).Hash.ToLower() -ne $hash) { throw "checksum: $file" }
          }
          foreach ($f in 'LICENSES\angband-copying.rst', 'LICENSES\openssl.txt', 'PLAYING.txt', 'watch-borg.cmd') { if (-not (Test-Path $f)) { throw "missing $f" } }
          cmd /c play-headless.cmd "$env:RUNNER_TEMP\g1" 101 0 0 20000; if ($LASTEXITCODE) { throw 'game 1' }
          cmd /c play-headless.cmd "$env:RUNNER_TEMP\g2" 102 2 1 20000; if ($LASTEXITCODE) { throw 'game 2' }
          cmd /c play-headless.cmd "$env:RUNNER_TEMP\g3" 103 5 3 20000; if ($LASTEXITCODE) { throw 'game 3' }
      - run: |
          t=$(cygpath -u '${{ runner.temp }}')
          python3 scripts/release/compare-games.py harness/reference/smoke-borg-rs \
            smoke-warrior-1="$t/g1" smoke-mage-2="$t/g2" smoke-priest-3="$t/g3"
      - if: failure()
        run: |
          t=$(cygpath -u '${{ runner.temp }}')
          for g in 1 2 3; do
            r=$(echo smoke-warrior-1 smoke-mage-2 smoke-priest-3 | cut -d' ' -f$g)
            echo "== $r"; [ -f "$t/g$g/messages.log" ] && { xz -dc "harness/reference/smoke-borg-rs/$r/messages.log.xz" | diff - "$t/g$g/messages.log" | head -30 || true; }
            tail -20 "$t/g$g/stderr.log" 2>/dev/null || true
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-failure
          path: |
            ${{ runner.temp }}/g1
            ${{ runner.temp }}/g2
            ${{ runner.temp }}/g3
            build/rust.make.log
          retention-days: 7
      - run: |
          t=$(cygpath -u '${{ runner.temp }}')
          mkdir -p "$t/identity"
          cp build/rust/BUILD_ID "$t/identity/BUILD_ID.windows-angband"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/package/*.zip
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: release-identity-windows
          path: ${{ runner.temp }}/identity
          retention-days: 3

  release:
    needs: [setup, source, linux, linux-clean, macos, windows]
    if: needs.setup.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
      - id: files
        run: |
          d="$RUNNER_TEMP/upload"; mkdir -p "$d"
          cp "$RUNNER_TEMP"/artifacts/release-linux/*.tar.gz "$RUNNER_TEMP"/artifacts/release-macos/*.tar.gz \
            "$RUNNER_TEMP"/artifacts/release-windows/*.zip "$RUNNER_TEMP"/artifacts/release-source/*.tar.gz "$d/"
          (cd "$d" && sha256sum *.tar.gz *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          python3 scripts/release/notes.py --version "${{ needs.setup.outputs.version }}" \
            --milestone "${{ needs.setup.outputs.milestone }}" --zoo "${{ needs.setup.outputs.zoo }}" \
            --since "${{ needs.setup.outputs.since }}" \
            $(for f in "$RUNNER_TEMP"/artifacts/release-identity-*/BUILD_ID.*; do printf -- '--build-id %s ' "$f"; done) \
            > "$RUNNER_TEMP/notes.md"
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.setup.outputs.version }}
          SHA: ${{ needs.setup.outputs.sha }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$SHA" \
            --title "borg-reborn-rs $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            $([[ "$VERSION" == *-* ]] && echo --prerelease) \
            "$RUNNER_TEMP"/upload/*
