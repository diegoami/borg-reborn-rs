name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash -n scripts/setup.sh
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 -m unittest discover -s tools/tests
      # The generated bindings match upstream's headers (TE.3): bindgen and
      # libclang, so the D3 audit's regeneration check runs too.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - run: cargo install bindgen-cli --version 0.73.2 --locked
      - run: engine/bindings/generate.sh --check
      # Upstream's own commit, so that test_engine checks that engine/UPSTREAM's
      # tree really is e473720's (E review, finding 7); without it, it fails.
      - run: |
          commit=$(sed -n 's/^commit=//p' engine/UPSTREAM)
          git init -q vendor/angband
          git -C vendor/angband fetch -q --depth 1 --filter=tree:0 https://github.com/angband/angband "$commit"
      - run: ENGINE_UPSTREAM_REQUIRED=1 python3 -m unittest discover -s engine/tests

  engine:
    # Builds the Rust Borg on our own integration (engine/, docs/SPEC.md §3,
    # TE.4) and runs it. Deaths in CI go to a temporary registry, never to
    # docs/deaths.
    runs-on: ubuntu-latest
    steps:
      - run: echo "BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/deaths" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake libx11-dev
      - run: BORG_IMPL=rust harness/build.sh
      - run: harness/identity.sh binary-impl build/rust/game/angband | grep -qx rust
      # The build, the source list and the frontend's contract on the binary (TE.4).
      - run: python3 -m unittest discover -s engine/tests
      # The reborn Borg plays (T1.5): smoke twice, same keys both times.
      - run: BORG_IMPL=rust harness/suite.sh smoke harness/out/smoke-rust-1
      - run: BORG_IMPL=rust harness/suite.sh smoke harness/out/smoke-rust-2
      - run: harness/diff --suite smoke --expect-impl rust harness/out/smoke-rust-1 harness/out/smoke-rust-2
      # ... and the same keys, messages and states as the reference (TE.5).
      - run: harness/diff --suite smoke --expect-impl rust harness/out/smoke-rust-1 harness/reference/smoke-rust
      # The decision trace and the parameter table are in the run outputs (T2.4).
      - run: for r in harness/out/smoke-rust-1/*/; do test -s "$r/trace.jsonl" && python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$r/params.json" && grep -q '^profile_sha256=' "$r/config.txt" || { echo "no trace or params in $r"; exit 1; }; done
      # A save loaded through run.sh's extra options resumes like save=NAME (re-review S1, S2).
      - run: BORG_IMPL=rust harness/check-extra-load.sh
      # Recorded observations round-trip through their log lines (T2.1);
      # replayed without the game they rebuild the live world model (T2.2);
      # the knowledge read from the game matches its data files, and the
      # blows computed from it equal the engine's on every think (T2.3).
      - run: BORG_OBSERVATION_LOG=$RUNNER_TEMP/observations.jsonl BORG_WORLD_LOG=$RUNNER_TEMP/worlds.txt BORG_KNOWLEDGE_LOG=$RUNNER_TEMP/knowledge.json BORG_IMPL=rust harness/run.sh harness/out/observations 101 0 0 3000
      - run: BORG_OBSERVATION_LOG_CHECK=$RUNNER_TEMP/observations.jsonl BORG_WORLD_LOG_CHECK=$RUNNER_TEMP/worlds.txt BORG_KNOWLEDGE_LOG_CHECK=$RUNNER_TEMP/knowledge.json cargo test -q -p borg-reborn-rs recorded -- --nocapture
      # RNG isolation (M1 review): perception while hallucinating must not move
      # the game's RNG, nor change what is observed; each think asserts it
      # (feature test-hallucinate). Perception against the engine (T2.5): each
      # think writes its comparison to truth.jsonl (feature test-perception).
      - run: BORG_IMPL=rust BORG_TEST_FEATURES=test-hallucinate,test-perception harness/build.sh
      # A test build's deaths are not natural deaths of an arm: own registry.
      - run: BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/test-deaths ANGBAND_BIN=$PWD/build/rust-test/game/angband BORG_IMPL=rust harness/suite.sh smoke harness/out/smoke-hallucinate
      # Full too: smoke has too few monsters to meet every case (T2.5 found
      # one only in full). The test build plays the reference's games, and
      # perception agrees with the engine on every think.
      - run: BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/test-deaths ANGBAND_BIN=$PWD/build/rust-test/game/angband BORG_IMPL=rust harness/suite.sh full harness/out/full-test
      - run: harness/diff --suite smoke --expect-impl rust harness/out/smoke-hallucinate harness/reference/smoke-rust
      - run: harness/diff --suite full --expect-impl rust harness/out/full-test harness/reference/full-rust
      - run: python3 tools/check-perception.py harness/out/smoke-hallucinate harness/out/full-test
      # No-time loops are visible too: level generation may not exceed its
      # declared cap at one game turn (M3 review, PR #135 finding 1).
      - run: python3 tools/check-no-time.py harness/out/smoke-rust-1 harness/out/full-test
      # The run contract on the Rust arm (T1.4, T1.8).
      - run: BORG_IMPL=rust harness/suite.sh smoke-exact harness/out/smoke-exact-rust
      - run: harness/check-boundary.py harness/out/smoke-exact-rust harness/out/smoke-rust-1
      - run: harness/diff --suite smoke-exact --expect-impl rust harness/out/smoke-exact-rust harness/reference/smoke-exact-rust
      # A death for the rerun check below (TE.6). Smoke has none, so CI
      # plays full-suite deaths on their own, in turn, until one dies: a
      # play change that saves one (#183 saved seed 1014's mage) leaves the
      # next. The list is the full reference's deaths, earliest first
      # (druid-0 seed 1020 at game turn 3,329; necro-0 1040 at 5,078;
      # mage-2 1012 at 4,841); each dossier is in docs/deaths.
      - run: |
          for c in "1020 2 2" "1040 4 4" "1012 3 1"; do
            rm -rf harness/out/rerun-source
            BORG_IMPL=rust harness/run.sh harness/out/rerun-source $c 100000 menu
            ls "$RUNNER_TEMP"/deaths/D*-rust-* >/dev/null 2>&1 && break
          done
      # Deaths (RULES 12, M1 review): keep CI's registry, and fail if a run
      # died a death that docs/deaths/ does not record.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-death-registry
          path: ${{ runner.temp }}/deaths
          if-no-files-found: ignore
      # Every natural death in the run outputs has a dossier (E review, finding 3).
      - run: python3 tools/reconcile-deaths.py "$RUNNER_TEMP/deaths" --runs harness/out/smoke-rust-1 harness/out/smoke-rust-2 harness/out/observations harness/out/check-extra-load harness/out/smoke-exact-rust harness/out/rerun-source
      # ... and in the dossiers of the reborn Borg's deaths (T2.4).
      # nullglob: runs with no natural death leave no dossier, and an
      # unmatched pattern must not be checked as if it were one (#125: the
      # smoke mage now survives). reconcile-deaths above still fails a death
      # without a dossier.
      - run: shopt -s nullglob; for d in "$RUNNER_TEMP"/deaths/D*-rust-*/; do test -s "$d/trace-tail.jsonl" && test -s "$d/params.json" || { echo "no trace or params in $d"; exit 1; }; done
      # A death reruns from its dossier with the Borg's logs, same keys (TE.6).
      - run: python3 tools/rerun-death.py "$(ls -d "$RUNNER_TEMP"/deaths/D*-rust-* | head -1)" "$RUNNER_TEMP/rerun"
