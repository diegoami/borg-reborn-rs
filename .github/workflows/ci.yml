name: ci

on:
  push:
    branches: [main, track-p]
  pull_request:

# A new push to a pull request cancels that PR's still-running older run
# (runner slots are shared with borg-zoo's experiments). Every push to main
# or track-p gets a group of its own (its run id), so none is ever queued
# behind or cancelled by another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cemetery-tools
      - uses: ./.github/actions/validation-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # borg-core is borg-rs vendored at its pin (#207): kept in borg-rs's
      # own formatting, and tested as borg-rs tests it (release: the unit
      # tests link without the engine only when unused engine calls are
      # optimised out).
      # Offline provenance attestation; builds never read an external source tree.
      - name: Verify exact recorded vendor bytes and hooks
        run: python3 scripts/borg-core-vendor.py check-recorded
      - name: Verify accepted R4 and R4.5 source
        run: |
          accepted_r4=40cbaf272193abb44dd80fad2cfeec24b627be22
          accepted_r45=e898abb5586135375434ad016e240686c022c53b
          receiving_main=24be98732748230062882fe2b7d9601dba5e2cc0
          git fetch --no-tags --depth=1 origin "$accepted_r4" "$accepted_r45" "$receiving_main"
          accepted="$RUNNER_TEMP/accepted-r4"
          git worktree add --detach "$accepted" "$accepted_r4"
          (
            cd "$accepted"
            for policy in power item-use equipment store attack defence; do
              python3 "scripts/audit-$policy-port.py" > /dev/null
            done
            python3 scripts/r4-code-metrics.py
            python3 -m unittest discover -s scripts/tests
          )
          archived_r45="$RUNNER_TEMP/accepted-r45"
          git worktree add --detach "$archived_r45" "$accepted_r45"
          cmp docs/R45-PORT-SOURCE.json "$archived_r45/docs/R45-PORT-SOURCE.json"
          cmp docs/R45-RECEIVING-SURFACE.json "$archived_r45/docs/R45-RECEIVING-SURFACE.json"
          (cd "$archived_r45" && python3 scripts/audit-r45-port.py)
          python3 scripts/audit-r45-port.py --receiving-r5
          python3 scripts/r45-receiving-surface.py > /dev/null
      - run: cargo fmt --check -p borg-reborn-rs -p borg-next
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude borg-core
      - run: cargo test --release -p borg-core
      - run: bash -n scripts/setup.sh
      - name: Receiving source-tool tests
        run: |
          python3 - <<'PYSOURCE'
          from pathlib import Path
          import sys
          import unittest

          # These assertions use the archived source and receipts checked above.
          r4_tests = {'equipment_port', 'item_use_port', 'p4_carry', 'policy_audits',
                      'power_port', 'store_port'}
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for test in sorted(Path('scripts/tests').glob('test_*.py')):
              if test.stem.removeprefix('test_') not in r4_tests:
                  suite.addTests(loader.discover('scripts/tests', pattern=test.name))
          sys.exit(not unittest.TextTestRunner(verbosity=1).run(suite).wasSuccessful())
          PYSOURCE
      - run: python3 scripts/check-death-ids.py docs/deaths
      - run: python3 tools/import-deaths.py --check
      # #601: every parameter cites the line that reads it (params.rs and docs/CALIBRATION.md).
      - run: python3 scripts/check-param-citations.py
      - run: python3 -m unittest discover -s tools/tests
      # Branch-local numeric IDs are provisional; new historical evidence is qualified.
      - run: python3 tools/import-deaths.py --check
      # The generated bindings match upstream's headers (TE.3): bindgen and
      # libclang, so the D3 audit's regeneration check runs too; the MinGW-w64
      # headers for the Windows layouts (bindings_windows.rs, #823).
      - uses: ./.github/actions/apt-install
        with:
          packages: libclang-dev mingw-w64-x86-64-dev
      # #588: the bindgen binary is cached, keyed by its version and the runner
      # image; cargo builds it (about 33 s) only on a cache miss.
      - id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bindgen
          key: bindgen-cli-0.73.2-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}
      - if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install bindgen-cli --version 0.73.2 --locked
      - run: bindgen --version
      - run: engine/bindings/generate.sh --check
      # Upstream's own commit, so that test_engine checks that engine/UPSTREAM's
      # tree really is e473720's (E review, finding 7); without it, it fails.
      - run: |
          commit=$(sed -n 's/^commit=//p' engine/UPSTREAM)
          git init -q vendor/angband
          git -C vendor/angband fetch -q --depth 1 --filter=tree:0 https://github.com/angband/angband "$commit"
      - run: ENGINE_UPSTREAM_REQUIRED=1 python3 -m unittest discover -s engine/tests

  engine:
    # Builds the Rust Borg on our own integration (engine/, docs/SPEC.md §3,
    # TE.4) and runs it. Deaths in CI go to a temporary registry, never to
    # docs/deaths.
    runs-on: ubuntu-latest
    steps:
      - run: echo "BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/deaths" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # #577: the full test suite (8 of this job's 12 minutes) plays the
      # reborn core only (BORG_CORE=reborn; #606 made borg-rs the harness
      # default). A pull request whose files are all docs, the
      # vendored borg-rs core or its settings cannot change that core's play,
      # and skips it. Those files can change the borg-rs core's play, which
      # this suite never measures: the borg-rs steps below do (the default
      # core's smoke against smoke-borg-rs, #606, plays the shipped
      # harness/borg.txt), and they run on every PR; the zoo measures more. Any other file, and every push to main or
      # track-p, runs the full suite. On a pull request HEAD is the merge
      # commit and HEAD^1 the base.
      - id: scope
        run: |
          full=1
          if [ "${{ github.event_name }}" = pull_request ] \
              && ! git diff --name-only HEAD^1 HEAD \
                | grep -qvE '^(docs/|reference/|borg-core/|harness/borg(_[a-z]+)?\.txt$|harness/scary_monsters[a-z_]*\.txt$|harness/plans/|[^/]+\.md$)'; then
              full=0
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "full test suite: $full"
      - uses: ./.github/actions/cemetery-tools
      - uses: ./.github/actions/validation-evidence
      - uses: dtolnay/rust-toolchain@stable
      # Canonical gameplay evidence is separate from the death-tool pin and
      # from the temporary registry produced by this CI run.
      - id: incident-evidence
        run: |
          python3 - <<'PYEVIDENCE'
          import json, os, pathlib
          f = json.loads(pathlib.Path('harness/fixtures/planmage-wild-cat.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + f['commit'] + '\n')
          PYEVIDENCE
      - uses: actions/checkout@v4
        with:
          repository: diegoami/borg-cemetery
          ref: ${{ steps.incident-evidence.outputs.commit }}
          path: vendor/cemetery-evidence
          persist-credentials: false
          sparse-checkout: |
            scenarios/planmage-wild-cat-fixtures
            scenarios/planmage-town-phase-407718
            validation/borg-reborn-rs/native-controls
      # #403: new parameter provenance changes the encounter identity even
      # when neutral play is identical. Reconcile against retained, immutable
      # Cemetery evidence, never against the registry produced by this run.
      - id: attack-evidence
        run: |
          python3 - <<'PYATTACK'
          import json, os, pathlib
          f = json.loads(pathlib.Path('harness/fixtures/attack-preferences.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + f['commit'] + '\n')
          PYATTACK
      - uses: actions/checkout@v4
        with:
          repository: diegoami/borg-cemetery
          ref: ${{ steps.attack-evidence.outputs.commit }}
          path: vendor/attack-preference-evidence
          persist-credentials: false
          sparse-checkout: |
            validation/borg-reborn-rs/class-attack-preferences/deaths
      # Keep the Track R receipts and the receiving pin's native control
      # evidence in the same read-only reconciliation index.
      - run: |
          python3 - <<'PYREGISTRY'
          import os, pathlib
          known = pathlib.Path(os.environ['RUNNER_TEMP']) / 'known-deaths'
          known.mkdir()
          sources = [
              pathlib.Path(os.environ['BORG_VALIDATION_ARCHIVE']),
              pathlib.Path('vendor/cemetery-evidence/validation/borg-reborn-rs/native-controls/deaths'),
              pathlib.Path('vendor/attack-preference-evidence/validation/borg-reborn-rs/class-attack-preferences/deaths'),
          ]
          for root in sources:
              for case in sorted(root.glob('D*')):
                  if case.is_dir() and (case / 'record.json').is_file():
                      (known / case.name).symlink_to(case.resolve(), target_is_directory=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('BORG_VALIDATION_ARCHIVE=' + str(known) + '\n')
          PYREGISTRY
      - uses: ./.github/actions/apt-install
        with:
          packages: cmake libx11-dev libssl-dev
      - run: BORG_IMPL=rust harness/build.sh
      - run: harness/identity.sh binary-impl build/rust/game/angband | grep -qx rust
      # R4: test-only copied memories. Queued commands never reach the game.
      - name: Constructed item-use controls
        run: |
          BORG_IMPL=rust BORG_TEST_FEATURES=test-r4-store flock /tmp/angband-validation.lock harness/build.sh
          for mode in check switch; do
            BORG_CORE=borg-rs BORG_CORE_OVERRIDES=off BORG_SHADOW=$mode BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/item-test-deaths ANGBAND_BIN=$PWD/build/rust-test/game/angband flock /tmp/angband-validation.lock harness/run.sh harness/out/item-use-fixture-$mode 1001 0 1 1000 menu
          done
          python3 - <<'PYITEM'
          import json, pathlib
          for mode in ('check', 'switch'):
              rows = [json.loads(line) for line in pathlib.Path(f'harness/out/item-use-fixture-{mode}/r4-item-use-fixtures.jsonl').read_text().splitlines()]
              assert len(rows) == 47 and len({r['case'] for r in rows}) == 47
              assert all(r['schema'] == 'borg-reborn-rs/r4-item-use-constructed@2'
                         and r['synthetic'] is True and r['engine_consumption'] is False
                         and r['stubbed_dependencies'] == ['borg_io::borg_note_bytes']
                         and r['mode'] == mode and r['value'] == r['expected']
                         and r['items_unchanged'] is True for r in rows)
              power = [json.loads(line) for line in pathlib.Path(f'harness/out/item-use-fixture-{mode}/r4-power-fixtures.jsonl').read_text().splitlines()]
              assert len(power) == 12 and len({r['case'] for r in power}) == 12
              assert all(r['schema'] == 'borg-reborn-rs/r4-power-constructed@2'
                         and r['synthetic'] is True and r['engine_consumption'] is False
                         and r['mode'] == mode
                         and r['items_unchanged'] is True for r in power)
              values = [r for r in power if r['control_kind'] == 'value-assertion']
              effects = [r for r in power if r['control_kind'] == 'parity-and-side-effects']
              assert len(values) == 8 and all(type(r['expected']) is int and r['value'] == r['expected'] for r in values)
              assert {r['case'] for r in effects} == {'empty-equipment', 'static-empty-preparation-stop', 'preparation-buffer-persists', 'explicit-shared-dynamic-formula'}
              assert all(r['expected'] is None for r in effects)
              equipment = [json.loads(line) for line in pathlib.Path(f'harness/out/item-use-fixture-{mode}/r4-equipment-fixtures.jsonl').read_text().splitlines()]
              assert len(equipment) == 26 and len({r['case'] for r in equipment}) == 26
              assert all(r['schema'] == 'borg-reborn-rs/r4-equipment-constructed@1'
                         and r['synthetic'] is True and r['mode'] == mode
                         and r['engine_consumption'] is False for r in equipment)
              values = [r for r in equipment if r['control_kind'] == 'value-and-state-assertion']
              restoration = [r for r in equipment if r['control_kind'] == 'parity-and-restoration']
              assert len(values) == 25 and all(r['value'] == r['expected'] for r in values)
              assert len(restoration) == 1 and restoration[0]['case'] == 'trial-restores-slots-and-quantity'
              assert restoration[0]['expected'] is None
              contract=json.loads(pathlib.Path('docs/R437-CONTROLS.json').read_text())
              store=[json.loads(line) for line in pathlib.Path(f'harness/out/item-use-fixture-{mode}/r4-store-fixtures.jsonl').read_text().splitlines()]
              assert len(store)==40 and {r['case'] for r in store}==set(contract['case_names'])
              assert all(r['schema']=='borg-reborn-rs/r4-store-constructed@1' and r['mode']==mode and r['synthetic'] and not r['engine_consumption'] for r in store)
              parity=[r for r in store if r['expected'] is None]
              assert {r['case'] for r in parity}==set(contract['parity_controls'])
              values=[r for r in store if r['expected'] is not None]
              assert len(values)==36 and all(r['value']==r['expected'] for r in values)
              receiving = pathlib.Path(f'harness/out/item-use-fixture-{mode}/r45-constructed.jsonl')
              rows = [json.loads(line) for line in receiving.read_text().splitlines()]
              assert all(r['schema']=='borg-reborn-rs/r45-constructed@1' and r['mode']==mode
                         and r['synthetic'] and not r['engine_consumption'] for r in rows)
              assert [(r['case'], r['value'], r['queued'], r['rng_draws']) for r in rows] == [
                  ('teleport-missing-escape-supply', {'Acted': False}, [], None),
                  ('teleport-accepts-sampled-landings', {'Acted': True}, [], 16698),
                  ('teleport-rejects-dangerous-landings', {'Acted': False}, [], 16698),
                  ('lightless-cures-poison', {'Acted': True}, [113, 97], None),
              ]
          PYITEM
          if strings build/rust/game/angband | grep -E 'R4 (item-use|power|equipment|store) constructed fixture|teleport-accepts-sampled-landings|teleport-rejects-dangerous-landings' > /dev/null; then
            echo 'Constructed fixtures leaked into the normal binary'; exit 1
          fi
      - name: Retain constructed item-use evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-item-use-fixtures
          path: harness/out/item-use-fixture-*
          if-no-files-found: ignore
      # R3: exercise the real selector/restoration bodies on declared owned
      # memories. Keep this test build and its artifacts separate from arms.
      - name: Constructed defence controls
        run: |
          BORG_IMPL=rust BORG_TEST_FEATURES=test-r3-defence flock /tmp/angband-validation.lock harness/build.sh
          for mode in check switch; do
            BORG_CORE=borg-rs BORG_CORE_OVERRIDES=off BORG_SHADOW=$mode BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/defence-test-deaths ANGBAND_BIN=$PWD/build/rust-test/game/angband flock /tmp/angband-validation.lock harness/run.sh harness/out/defence-fixture-$mode 1001 0 1 1000 menu
          done
          python3 - <<'PYDEFENCE'
          import json, pathlib
          labels = {f'selector-{n}' for n in range(31)} | {
              'speed-restoration', 'grim-confusion-nonbinary', 'grim-free-action-nonbinary',
              'fire-restoration', 'cold-restoration', 'acid-restoration',
              'electricity-restoration', 'poison-restoration', 'protection-evil-restoration',
              'shield-restoration', 'all-resists-restoration', 'morgoth-rest-simulation'}
          for mode in ('check', 'switch'):
              path = pathlib.Path(f'harness/out/defence-fixture-{mode}/r3-defence-fixtures.jsonl')
              rows = [json.loads(line) for line in path.read_text().splitlines()]
              assert len(rows) == 43 and {r['case'] for r in rows} == labels
              assert all(r['schema'] == 'borg-reborn-rs/r3-defence-constructed@1'
                         and r['synthetic'] is True and r['mode'] == mode
                         and r['agreement_error'] is None and r['temporary_buffs_restored'] is True
                         and r['driving_value'] == r['replayed_value'] for r in rows)
              by_case = {r['case']: r for r in rows}
              assert by_case['grim-confusion-nonbinary']['final_confusion_free_action'] == [1, 0]
              assert by_case['grim-free-action-nonbinary']['final_confusion_free_action'] == [0, 1]
              assert by_case['morgoth-rest-simulation']['driving_value'] > 0
          PYDEFENCE
      - name: Retain constructed defence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-defence-fixtures
          path: harness/out/defence-fixture-*
          if-no-files-found: ignore
      # Track P (#219): exercise the vendored core's real initialization,
      # not only the pure parser. Its named trace has a separate registry;
      # original-core dossiers below retain their trace.jsonl contract.
      - run: BORG_CORE=borg-rs BORG_CORE_OVERRIDES=off BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/core-deaths harness/run.sh harness/out/core-params 1010 0 0 3000 menu
      - run: |
          python3 - <<'PYCORE'
          import hashlib, json, pathlib
          run = pathlib.Path('harness/out/core-params')
          data = (run / 'params-core.json').read_bytes()
          settings = json.loads(data)
          assert settings and all(p['value'] == p['default'] and p['origin'] == 'default' for p in settings)
          assert 'params_core_sha256=' + hashlib.sha256(data).hexdigest() in (run / 'config.txt').read_text()
          rows = [json.loads(l) for l in (run / 'trace-core.jsonl').read_text().splitlines()]
          assert rows and [r['think'] for r in rows] == list(range(1, len(rows) + 1))
          assert all(r['schema'] == 'borg-reborn-rs/core-trace@2' and r['check'] != 'unclassified' for r in rows)
          assert all(isinstance(r['keys'], list) and set(r['goals']) == {'leaving', 'fleeing', 'fleeing_to_town', 'rising'} for r in rows)
          PYCORE
          if BORG_CORE=borg-rs BORG_PARAM_CAUTION_CLW_MIN_LOSS=101 harness/run.sh harness/out/core-invalid 1010 0 0 3000 menu; then
            echo 'invalid core parameter was accepted'; exit 1
          fi
          grep -q 'caution_clw_min_loss: 101 outside 0..=100' harness/out/core-invalid/stderr.log
      # P1.4: recording leaves the game unchanged, and the final thinks of
      # a real death survive in the named core trace's dossier tail.
      # #470: seed 1016 (seed 1011's Mage now lives to the turn cap).
      - run: |
          BORG_CORE=borg-rs BORG_CORE_OVERRIDES=off BORG_CORE_TRACE=off BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/core-deaths harness/run.sh harness/out/core-trace-off 1010 0 0 3000 menu
          for f in keys.log messages.log state.log; do cmp "harness/out/core-params/$f" "harness/out/core-trace-off/$f"; done
          test ! -e harness/out/core-trace-off/trace-core.jsonl
          BORG_CORE=borg-rs BORG_CORE_OVERRIDES=off BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/core-deaths harness/run.sh harness/out/core-trace-death 1016 2 1 100000 menu
          python3 tools/reconcile-deaths.py --registry "$BORG_VALIDATION_ARCHIVE" "$RUNNER_TEMP/core-deaths" --runs harness/out/core-params harness/out/core-trace-off harness/out/core-trace-death
          python3 - "$RUNNER_TEMP/core-deaths" <<'PYCORE'
          import json, pathlib, sys
          cases = list(pathlib.Path(sys.argv[1]).glob('D-*'))
          assert cases
          for case in cases:
              rows = [json.loads(l) for l in (case / 'trace-core-tail.jsonl').read_text().splitlines()]
              assert rows and len(rows) <= 200 and all(r['check'] != 'unclassified' for r in rows)
              assert json.loads((case / 'record.json').read_text())['core_decision_trace']['lines'] == len(rows)
          PYCORE
      # Track R: pure danger and stateful caution/escape/recovery must have
      # real coverage, zero mismatches and identical off/check/switch play.
      - run: |
          BORG_CORE=borg-rs BORG_CORE_OVERRIDES=on BORG_SHADOW=off BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/core-deaths harness/suite.sh smoke harness/out/shadow-off
          BORG_CORE=borg-rs BORG_CORE_OVERRIDES=on BORG_SHADOW=check BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/core-deaths harness/suite.sh smoke harness/out/shadow-check
          BORG_CORE=borg-rs BORG_CORE_OVERRIDES=on BORG_SHADOW=switch BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/core-deaths harness/suite.sh smoke harness/out/shadow-switch
          harness/check-shadow.py --r5 --expect-mode check harness/out/shadow-check
          harness/check-shadow.py --r5 --expect-mode switch harness/out/shadow-switch
          harness/diff --suite smoke --expect-impl rust harness/out/shadow-off harness/out/shadow-check
          harness/diff --suite smoke --expect-impl rust harness/out/shadow-off harness/out/shadow-switch
          python3 tools/reconcile-deaths.py --registry "$BORG_VALIDATION_ARCHIVE" "$RUNNER_TEMP/core-deaths" --runs harness/out/shadow-off harness/out/shadow-check harness/out/shadow-switch
      # R2 review: aggregate totals cannot substitute for every public entry.
      # The focused unsealed seed reaches rare caution_teleport; not all branches.
      - name: Stateful entry-point coverage
        run: |
          BORG_CORE=borg-rs BORG_CORE_OVERRIDES=off BORG_SHADOW=check BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/core-deaths JOBS=1 harness/suite.sh stateful-entries harness/out/stateful-entries-check
          BORG_CORE=borg-rs BORG_CORE_OVERRIDES=off BORG_SHADOW=switch BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/core-deaths JOBS=1 harness/suite.sh stateful-entries harness/out/stateful-entries-switch
          harness/check-shadow.py --r5 --require-all-entries --expect-mode check harness/out/shadow-check harness/out/stateful-entries-check harness/out/item-use-fixture-check --constructed-root harness/out/item-use-fixture-check --report harness/out/shadow-coverage-check.json
          harness/check-shadow.py --r5 --require-all-entries --expect-mode switch harness/out/shadow-switch harness/out/stateful-entries-switch harness/out/item-use-fixture-switch --constructed-root harness/out/item-use-fixture-switch --report harness/out/shadow-coverage-switch.json
          harness/diff --suite stateful-entries --expect-impl rust harness/out/stateful-entries-check harness/out/stateful-entries-switch
          python3 tools/reconcile-deaths.py --registry "$BORG_VALIDATION_ARCHIVE" "$RUNNER_TEMP/core-deaths" --runs harness/out/stateful-entries-check harness/out/stateful-entries-switch
      - name: Retain declared natural and constructed run coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-shadow-coverage
          path: harness/out/shadow-coverage-*.json
          if-no-files-found: ignore
      # P3: exercise the actual profile serializer and run_cell at our zoo pin.
      - run: |
          zoo_pin=$(python3 -c "import json; print(json.load(open('pins.json'))['pins']['borg-zoo']['commit'])")
          git init -q vendor/borg-zoo
          git -C vendor/borg-zoo fetch -q --depth 1 https://github.com/diegoami/borg-zoo "$zoo_pin"
          git -C vendor/borg-zoo checkout -q --detach "$zoo_pin"
          echo "BORG_ZOO_CONTRACT_REQUIRED=1" >> "$GITHUB_ENV"
      # Native preference tests use their own death registry. The original
      # core's observation/replay check below must continue to select one of
      # that core's deaths, rather than a differently configured native run.
      - run: echo "BORG_ATTACK_PREFERENCE_DEATHS_DIR=$RUNNER_TEMP/attack-preference-deaths" >> "$GITHUB_ENV"
      # The build, the source list and the frontend's contract on the binary (TE.4).
      # #350: immutable, source-qualified saves from the recorded wild-cat incident.
      - run: |
          python3 - <<'PYFIXTURE'
          import json, os, pathlib, shutil
          f = json.loads(pathlib.Path('harness/fixtures/planmage-wild-cat.json').read_text())
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / f['archive']
          shutil.copyfile(pathlib.Path('vendor/cemetery-evidence') / f['archive_path'], target)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('BORG_SURVIVAL_FIXTURE_ZIP=' + str(target) + '\nBORG_SURVIVAL_FIXTURES_REQUIRED=1\n')
          PYFIXTURE
      - run: |
          python3 - <<'PYPHASE'
          import json, os, pathlib, shutil
          f = json.loads(pathlib.Path('harness/fixtures/planmage-town-phase.json').read_text())
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'phase-stock.zip'
          shutil.copyfile(pathlib.Path('vendor/cemetery-evidence') / f['archive_path'], target)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('BORG_PHASE_STOCK_FIXTURE_ZIP=' + str(target) + '\nBORG_PHASE_STOCK_FIXTURE_REQUIRED=1\n')
          PYPHASE
      - run: python3 -m unittest discover -s engine/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-attack-preference-death-registry
          path: ${{ runner.temp }}/attack-preference-deaths
          if-no-files-found: ignore
      - run: python3 tools/reconcile-deaths.py "$RUNNER_TEMP/attack-preference-deaths" --registry vendor/attack-preference-evidence/validation/borg-reborn-rs/class-attack-preferences/deaths
      # The reborn Borg plays (T1.5): smoke twice, same keys both times.
      # #606: these reborn-core steps say BORG_CORE=reborn; the harness
      # default is the borg-rs core (its smoke check follows them).
      - run: BORG_CORE=reborn BORG_IMPL=rust harness/suite.sh smoke harness/out/smoke-rust-1
      - run: BORG_CORE=reborn BORG_IMPL=rust harness/suite.sh smoke harness/out/smoke-rust-2
      - run: harness/diff --suite smoke --expect-impl rust harness/out/smoke-rust-1 harness/out/smoke-rust-2
      # ... and the same keys, messages and states as the reference (TE.5).
      - run: harness/diff --suite smoke --expect-impl rust harness/out/smoke-rust-1 harness/reference/smoke-rust
      # The decision trace and the parameter table are in the run outputs (T2.4).
      # #606: the harness default, the borg-rs core (it reads harness/borg.txt),
      # plays smoke twice with the same keys, and the same keys, messages and
      # states as its own reference.
      - run: BORG_IMPL=rust harness/suite.sh smoke harness/out/smoke-borg-rs-1
      - run: BORG_IMPL=rust harness/suite.sh smoke harness/out/smoke-borg-rs-2
      - run: harness/diff --suite smoke --expect-impl rust harness/out/smoke-borg-rs-1 harness/out/smoke-borg-rs-2
      - run: harness/diff --suite smoke --expect-impl rust harness/out/smoke-borg-rs-1 harness/reference/smoke-borg-rs
      - id: ranger-phase
        run: python3 harness/check-ranger-phase.py --out "$RUNNER_TEMP/ranger-phase"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.ranger-phase.outcome == 'failure'
        with:
          name: ranger-phase-failure
          path: ${{ runner.temp }}/ranger-phase
      - run: for r in harness/out/smoke-rust-1/*/; do test -s "$r/trace.jsonl" && python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$r/params.json" && grep -q '^profile_sha256=' "$r/config.txt" || { echo "no trace or params in $r"; exit 1; }; done
      # A save loaded through run.sh's extra options resumes like save=NAME (re-review S1, S2).
      - run: BORG_CORE=reborn BORG_IMPL=rust harness/check-extra-load.sh
      # Recorded observations round-trip through their log lines (T2.1);
      # replayed without the game they rebuild the live world model (T2.2);
      # the knowledge read from the game matches its data files, and the
      # blows computed from it equal the engine's on every think (T2.3).
      - run: BORG_CORE=reborn BORG_OBSERVATION_LOG=$RUNNER_TEMP/observations.jsonl BORG_WORLD_LOG=$RUNNER_TEMP/worlds.txt BORG_KNOWLEDGE_LOG=$RUNNER_TEMP/knowledge.json BORG_IMPL=rust harness/run.sh harness/out/observations 101 0 0 3000
      - run: BORG_OBSERVATION_LOG_CHECK=$RUNNER_TEMP/observations.jsonl BORG_WORLD_LOG_CHECK=$RUNNER_TEMP/worlds.txt BORG_KNOWLEDGE_LOG_CHECK=$RUNNER_TEMP/knowledge.json cargo test -q -p borg-reborn-rs recorded -- --nocapture
      # RNG isolation (M1 review): perception while hallucinating must not move
      # the game's RNG, nor change what is observed; each think asserts it
      # (feature test-hallucinate). Perception against the engine (T2.5): each
      # think writes its comparison to truth.jsonl (feature test-perception).
      - run: BORG_IMPL=rust BORG_TEST_FEATURES=test-hallucinate,test-perception,test-stair-handoff harness/build.sh
      - run: |
          sed -n 's/^test_features=//p' build/rust-test/BUILD_ID | tr ',' '\n' | grep -Fxq test-stair-handoff
          python3 engine/tests/test_stair_handoff.py EmergencyStairHandoffTest
      # A test build's deaths are not natural deaths of an arm: own registry.
      - run: BORG_CORE=reborn BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/test-deaths ANGBAND_BIN=$PWD/build/rust-test/game/angband BORG_IMPL=rust harness/suite.sh smoke harness/out/smoke-hallucinate
      # Full too: smoke has too few monsters to meet every case (T2.5 found
      # one only in full). The test build plays the reference's games, and
      # perception agrees with the engine on every think.
      - if: steps.scope.outputs.full == '1'
        run: BORG_CORE=reborn BORG_DEATH_RECORDS_DIR=$RUNNER_TEMP/test-deaths ANGBAND_BIN=$PWD/build/rust-test/game/angband BORG_IMPL=rust harness/suite.sh full harness/out/full-test
      - run: harness/diff --suite smoke --expect-impl rust harness/out/smoke-hallucinate harness/reference/smoke-rust
      - if: steps.scope.outputs.full == '1'
        run: harness/diff --suite full --expect-impl rust harness/out/full-test harness/reference/full-rust
      - run: python3 tools/check-perception.py harness/out/smoke-hallucinate ${{ steps.scope.outputs.full == '1' && 'harness/out/full-test' || '' }}
      # No-time loops are visible too: level generation may not exceed its
      # declared cap at one game turn (M3 review, PR #135 finding 1).
      - run: python3 tools/check-no-time.py harness/out/smoke-rust-1 ${{ steps.scope.outputs.full == '1' && 'harness/out/full-test' || '' }}
      # The run contract on the Rust arm (T1.4, T1.8).
      - run: BORG_CORE=reborn BORG_IMPL=rust harness/suite.sh smoke-exact harness/out/smoke-exact-rust
      - run: harness/check-boundary.py harness/out/smoke-exact-rust harness/out/smoke-rust-1
      - run: harness/diff --suite smoke-exact --expect-impl rust harness/out/smoke-exact-rust harness/reference/smoke-exact-rust
      # A death for the rerun check below (TE.6). Smoke has none, so CI
      # plays full-suite deaths on their own, in turn, until one dies: a
      # play change that saves one (#183 saved seed 1014's mage) leaves the
      # next. The list is the full reference's deaths, earliest first
      # (druid-0 seed 1020 at game turn 3,329; necro-0 1040 at 5,078;
      # mage-2 1012 at 4,841); each dossier is in docs/deaths.
      - run: |
          for c in "1020 2 2" "1040 4 4" "1012 3 1"; do
            rm -rf harness/out/rerun-source
            BORG_CORE=reborn BORG_IMPL=rust harness/run.sh harness/out/rerun-source $c 100000 menu
            ls "$RUNNER_TEMP"/deaths/D-* >/dev/null 2>&1 && break
          done
      # Deaths (RULES 12, M1 review): keep CI's registry, and fail if a run
      # died a death that docs/deaths/ does not record.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-death-registry
          path: ${{ runner.temp }}/deaths
          if-no-files-found: ignore
      # Every natural death in the run outputs has a dossier (E review, finding 3).
      - run: python3 tools/reconcile-deaths.py "$RUNNER_TEMP/deaths" --registry "$BORG_VALIDATION_ARCHIVE" --runs harness/out/smoke-rust-1 harness/out/smoke-rust-2 harness/out/smoke-borg-rs-1 harness/out/smoke-borg-rs-2 harness/out/observations harness/out/check-extra-load harness/out/smoke-exact-rust harness/out/rerun-source
      # ... and the dossiers carry their core's trace and parameters (T2.4):
      # the reborn core's trace-tail.jsonl and params.json, or the borg-rs
      # core's trace-core-tail.jsonl and params-core.json (#606). A borg-rs
      # death needs a Cemetery package like any other (reconcile-deaths above).
      # nullglob: runs with no natural death leave no dossier, and an
      # unmatched pattern must not be checked as if it were one (#125: the
      # smoke mage now survives). reconcile-deaths above still fails a death
      # without a dossier.
      - run: shopt -s nullglob; for d in "$RUNNER_TEMP"/deaths/D-*/; do { test -s "$d/trace-tail.jsonl" && test -s "$d/params.json"; } || { test -s "$d/trace-core-tail.jsonl" && test -s "$d/params-core.json"; } || { echo "no trace or params in $d"; exit 1; }; done
      # A death reruns from its dossier with the Borg's logs, same keys (TE.6).
      - run: python3 tools/rerun-death.py "$(ls -d "$RUNNER_TEMP"/deaths/D-* | head -1)" "$RUNNER_TEMP/rerun"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-core-death-registry
          path: ${{ runner.temp }}/core-deaths
          if-no-files-found: ignore

  recorder:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cemetery-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/apt-install
        with:
          packages: libx11-dev libssl-dev
      - run: cmake -S engine -B build/recorder -DSUPPORT_BORG_RECORDING=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/recorder -j4
      - run: python3 harness/check-recorder.py --binary build/recorder/game/angband --output "$RUNNER_TEMP/recorder-check"

  r4-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: receipt
        shell: bash
        run: |
          python3 - <<'PYRECEIPT'
          import json, os
          from pathlib import Path
          receipt=json.loads(Path('docs/R438-EVIDENCE-RECEIPT.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('commit='+receipt['commit']+'\n')
          PYRECEIPT
      - uses: actions/checkout@v4
        with:
          repository: diegoami/borg-cemetery
          ref: ${{ steps.receipt.outputs.commit }}
          path: vendor/r4-combined-evidence
          persist-credentials: false
          sparse-checkout: |
            runs/validation/track-r/r4-combined-dc1491b9
            scripts
            deaths/ALIASES.json
          sparse-checkout-cone-mode: false
      - run: python3 tools/verify-r4-evidence.py --cemetery vendor/r4-combined-evidence --receipt docs/R438-EVIDENCE-RECEIPT.json
